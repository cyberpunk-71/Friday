<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Friday Sensor</title>
<style>body{font-family:system-ui;width:280px;padding:14px;background:#0b0e14;color:#e8ecf4}
h3{margin:0 0 10px}label{display:block;margin:8px 0;font-size:13px}
input[type=text]{width:100%;box-sizing:border-box;padding:6px;border-radius:8px;border:1px solid #232b3d;background:#11151f;color:#e8ecf4}
button{width:100%;padding:8px;margin-top:10px;border:none;border-radius:8px;background:#6ea8ff;color:#0b0e14;font-weight:700;cursor:pointer}
#status{font-size:12px;color:#8b94a7;margin-top:8px}</style></head>
<body>
<h3>🎯 Friday Sensor</h3>
<label>Server URL <input id="server" placeholder="http://localhost:8000"/></label>
<label><input type="checkbox" id="observeAll" checked/> Learn every page I visit</label>
<label><input type="checkbox" id="focusNudges" checked/> Nudge me during focus</label>
<label><input type="checkbox" id="chromeNudges" checked/> Chrome notifications</label>
<label><input type="checkbox" id="voiceNudges" checked/> Voice nudges</label>
<button id="save">Save</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>

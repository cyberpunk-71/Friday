# Friday VM ops — receives repository_dispatch and runs scripts/vm_cycle.sh on
# the self-hosted VM runner. MUST LIVE ON main for dispatches to fire.
# Results are returned via BOTH a git commit (best-effort) AND a downloadable
# artifact (reliable) so the dispatcher can always read the outcome.
name: vm-ops

on:
  repository_dispatch:
    types: [vm-ops]

permissions:
  contents: write

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || 'main' }}
          fetch-depth: 0

      - name: Run Friday ops
        env:
          CMD: ${{ github.event.client_payload.command }}
          BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          FRIDAY_DEEPSEEK_KEY: ${{ github.event.client_payload.key }}
        run: |
          if [ -n "$FRIDAY_DEEPSEEK_KEY" ]; then
            echo "::add-mask::$FRIDAY_DEEPSEEK_KEY"
          fi
          bash scripts/vm_cycle.sh "$CMD" "$BRANCH" || true

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: vm_diagnostics/
          if-no-files-found: ignore

      - name: Commit diagnostics back
        run: |
          git config user.email "vm-ops@friday.local"
          git config user.name "Friday VM Ops"
          git add vm_diagnostics/manual/latest.json
          git commit -m "vm-ops: ${{ github.event.client_payload.command }} result" || true
          git push origin "HEAD:${{ github.event.client_payload.branch || 'main' }}" || true

# Friday VM ops v2 — receives repository_dispatch and runs scripts/vm_cycle.sh
# on the self-hosted VM runner. MUST LIVE ON main.
# Results come back as a downloadable artifact (reliable) + a git commit
# (best-effort; git may be missing from the runner PATH — we export it).
name: vm-ops

on:
  repository_dispatch:
    types: [vm-ops]

permissions:
  contents: write

jobs:
  run:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || 'main' }}
          fetch-depth: 0

      - name: Run Friday ops
        env:
          CMD: ${{ github.event.client_payload.command }}
          BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          FRIDAY_DEEPSEEK_KEY: ${{ github.event.client_payload.key }}
        run: |
          if [ -n "$FRIDAY_DEEPSEEK_KEY" ]; then
            echo "::add-mask::$FRIDAY_DEEPSEEK_KEY"
          fi
          bash scripts/vm_cycle.sh "$CMD" "$BRANCH" || true

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: vm_diagnostics/
          if-no-files-found: ignore

      - name: Commit diagnostics back
        env:
          BRANCH: ${{ github.event.client_payload.branch || 'main' }}
        run: |
          export PATH="$PATH:/usr/bin:/usr/local/bin:/snap/bin"
          command -v git || echo "git not found on runner PATH"
          git config user.email "vm-ops@friday.local" || true
          git config user.name "Friday VM Ops" || true
          git add vm_diagnostics/manual/latest.json || true
          git commit -m "vm-ops: ${{ github.event.client_payload.command }} result" || true
          git push origin "HEAD:$BRANCH" || true
